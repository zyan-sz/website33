<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About Us Section</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #333;
    }

    .about-section {
      padding: 40px 20px;
      max-width: 1200px;
      margin: auto;
    }

    .about-title {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 40px;
      font-weight: bold;
    }

    .about-content {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
    }

    .about-image {
      flex: 1;
    }

    .about-image img {
      width: 100%;
      border-radius: 10px;
      max-height: 400px;
      object-fit: cover;
    }

    .about-text {
      flex: 1;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    @media (max-width: 768px) {
      .about-content {
        flex-direction: column;
        text-align: center;
      }

      .about-text {
        margin-top: 20px;
      }
    }
  </style>
</head>
<body>

  <section class="about-section">
    <h2 class="about-title">About Us</h2>
    <div class="about-content">
      <div class="about-image">
        <img src="https://via.placeholder.com/500x400" alt="About Us Image" />
      </div>
      <div class="about-text">
        <p>
          Welcome to our company! We are passionate about delivering high-quality products and services that bring real value to our customers. Our team is dedicated to innovation, excellence, and building lasting relationships. Thank you for choosing us!
        </p>
      </div>
    </div>
  </section>

</body>
</html>
